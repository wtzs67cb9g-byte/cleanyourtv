name: Build Web App
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: platforms;android-34 build-tools;34.0.0
      - name: Write the app source
        run: |
          mkdir -p "addons/web-app/app"
          cat > "addons/web-app/app/build.gradle" <<'WEBAPP_EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.gathin.webapp'
              compileSdk 34

              defaultConfig {
                  applicationId 'com.gathin.webapp'
                  minSdk 26
                  targetSdk 34
                  versionCode 1
                  versionName '1.0'
              }

              buildTypes {
                  release {
                      minifyEnabled true
                      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
                      signingConfig signingConfigs.debug
                  }
              }

              lint {
                  abortOnError false
                  checkReleaseBuilds false
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          WEBAPP_EOF
          mkdir -p "addons/web-app/app"
          cat > "addons/web-app/app/proguard-rules.pro" <<'WEBAPP_EOF'
          # Shrink and optimise, but keep class and method names: the size win comes from dropping unused
          # AndroidX code, not from renaming, and readable stack traces matter more in a sideloaded app
          # where crash reports arrive as screenshots.
          -dontobfuscate
          WEBAPP_EOF
          mkdir -p "addons/web-app/app/src/main"
          cat > "addons/web-app/app/src/main/AndroidManifest.xml" <<'WEBAPP_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-feature android:name="android.software.leanback" android:required="false" />
              <uses-feature android:name="android.hardware.touchscreen" android:required="false" />

              <application
                  android:label="موقعي"
                  android:icon="@drawable/icon"
                  android:banner="@drawable/banner"
                  android:allowBackup="false"
                  android:supportsRtl="true"
                  android:usesCleartextTraffic="true">

                  <!-- The site's address never ships in the app: send it once over adb, it is kept on the TV.
                       adb shell am start -n com.gathin.webapp/.MainActivity -d "https://example.com" -->
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTask"
                      android:configChanges="orientation|screenSize|keyboard|keyboardHidden|navigation"
                      android:theme="@android:style/Theme.DeviceDefault.NoActionBar.Fullscreen">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                          <category android:name="android.intent.category.LEANBACK_LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          WEBAPP_EOF
          mkdir -p "addons/web-app/app/src/main/java/com/gathin/webapp"
          cat > "addons/web-app/app/src/main/java/com/gathin/webapp/MainActivity.java" <<'WEBAPP_EOF'
          package com.gathin.webapp;

          import android.app.Activity;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.graphics.Color;
          import android.net.Uri;
          import android.os.Bundle;
          import android.text.InputType;
          import android.util.TypedValue;
          import android.view.Gravity;
          import android.view.View;
          import android.view.inputmethod.EditorInfo;
          import android.webkit.CookieManager;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.Button;
          import android.widget.EditText;
          import android.widget.FrameLayout;
          import android.widget.LinearLayout;
          import android.widget.TextView;

          /**
           * Opens one website full screen. The address is not built into the app: it is sent once over adb
           * (am start ... -d "https://...") or typed on first launch, and kept only on this TV.
           */
          public class MainActivity extends Activity {

              private SharedPreferences prefs;
              private FrameLayout root;
              private WebView web;
              private View fullscreenView;
              private WebChromeClient.CustomViewCallback fullscreenCallback;

              @Override
              protected void onCreate(Bundle saved) {
                  super.onCreate(saved);
                  prefs = getSharedPreferences("site", MODE_PRIVATE);
                  root = new FrameLayout(this);
                  root.setBackgroundColor(Color.BLACK);
                  setContentView(root);
                  takeAddress(getIntent());
                  String url = prefs.getString("url", null);
                  if (url == null) showSetup();
                  else showWeb(url);
              }

              @Override
              protected void onNewIntent(Intent intent) {
                  super.onNewIntent(intent);
                  if (takeAddress(intent)) showWeb(prefs.getString("url", null));
              }

              /** An http(s) address passed with -d replaces the saved one. */
              private boolean takeAddress(Intent intent) {
                  Uri data = intent == null ? null : intent.getData();
                  if (data == null) return false;
                  String scheme = data.getScheme();
                  if (!"http".equals(scheme) && !"https".equals(scheme)) return false;
                  prefs.edit().putString("url", data.toString()).apply();
                  return true;
              }

              private void showSetup() {
                  root.removeAllViews();
                  LinearLayout box = new LinearLayout(this);
                  box.setOrientation(LinearLayout.VERTICAL);
                  box.setGravity(Gravity.CENTER);
                  box.setPadding(dp(64), dp(32), dp(64), dp(32));

                  TextView title = new TextView(this);
                  title.setText("اكتب رابط الموقع");
                  title.setTextColor(Color.WHITE);
                  title.setTextSize(TypedValue.COMPLEX_UNIT_SP, 28);
                  title.setGravity(Gravity.CENTER);
                  box.addView(title);

                  EditText field = new EditText(this);
                  field.setHint("https://");
                  field.setTextColor(Color.WHITE);
                  field.setHintTextColor(0xFF9E9E9E);
                  field.setSingleLine(true);
                  field.setInputType(InputType.TYPE_CLASS_TEXT | InputType.TYPE_TEXT_VARIATION_URI);
                  field.setImeOptions(EditorInfo.IME_ACTION_GO);
                  field.setTextDirection(View.TEXT_DIRECTION_LTR);
                  LinearLayout.LayoutParams fp = new LinearLayout.LayoutParams(dp(600), -2);
                  fp.topMargin = dp(24);
                  box.addView(field, fp);

                  Button open = new Button(this);
                  open.setText("فتح");
                  LinearLayout.LayoutParams bp = new LinearLayout.LayoutParams(-2, -2);
                  bp.topMargin = dp(16);
                  box.addView(open, bp);

                  Runnable go = () -> {
                      String u = field.getText().toString().trim();
                      if (u.isEmpty()) return;
                      if (!u.startsWith("http://") && !u.startsWith("https://")) u = "https://" + u;
                      prefs.edit().putString("url", u).apply();
                      showWeb(u);
                  };
                  open.setOnClickListener(v -> go.run());
                  field.setOnEditorActionListener((v, actionId, event) -> {
                      go.run();
                      return true;
                  });

                  root.addView(box, new FrameLayout.LayoutParams(-1, -1));
                  field.requestFocus();
              }

              private void showWeb(String url) {
                  if (url == null) {
                      showSetup();
                      return;
                  }
                  if (web == null) {
                      web = new WebView(this);
                      WebSettings s = web.getSettings();
                      s.setJavaScriptEnabled(true);
                      s.setDomStorageEnabled(true);
                      s.setMediaPlaybackRequiresUserGesture(false);
                      s.setUseWideViewPort(true);
                      s.setLoadWithOverviewMode(true);
                      s.setSupportMultipleWindows(false);
                      CookieManager.getInstance().setAcceptCookie(true);
                      CookieManager.getInstance().setAcceptThirdPartyCookies(web, true);
                      web.setWebViewClient(new WebViewClient());
                      web.setWebChromeClient(new WebChromeClient() {
                          @Override
                          public void onShowCustomView(View view, CustomViewCallback callback) {
                              fullscreenView = view;
                              fullscreenCallback = callback;
                              web.setVisibility(View.GONE);
                              root.addView(view, new FrameLayout.LayoutParams(-1, -1));
                          }

                          @Override
                          public void onHideCustomView() {
                              leaveFullscreen();
                          }
                      });
                  }
                  root.removeAllViews();
                  root.addView(web, new FrameLayout.LayoutParams(-1, -1));
                  web.setVisibility(View.VISIBLE);
                  web.loadUrl(url);
                  web.requestFocus();
              }

              private void leaveFullscreen() {
                  if (fullscreenView == null) return;
                  root.removeView(fullscreenView);
                  fullscreenView = null;
                  if (fullscreenCallback != null) fullscreenCallback.onCustomViewHidden();
                  fullscreenCallback = null;
                  web.setVisibility(View.VISIBLE);
                  web.requestFocus();
              }

              @Override
              public void onBackPressed() {
                  if (fullscreenView != null) {
                      leaveFullscreen();
                  } else if (web != null && web.getParent() != null && web.canGoBack()) {
                      web.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }

              @Override
              protected void onPause() {
                  if (web != null) web.onPause();
                  CookieManager.getInstance().flush();
                  super.onPause();
              }

              @Override
              protected void onResume() {
                  super.onResume();
                  if (web != null) web.onResume();
              }

              @Override
              protected void onDestroy() {
                  if (web != null) web.destroy();
                  super.onDestroy();
              }

              private int dp(int v) {
                  return Math.round(v * getResources().getDisplayMetrics().density);
              }
          }
          WEBAPP_EOF
          mkdir -p "addons/web-app/app/src/main/res/drawable"
          cat > "addons/web-app/app/src/main/res/drawable/banner.xml" <<'WEBAPP_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="rectangle">
              <solid android:color="#2F6F5E" />
              <corners android:radius="8dp" />
              <size android:width="320dp" android:height="180dp" />
          </shape>
          WEBAPP_EOF
          mkdir -p "addons/web-app/app/src/main/res/drawable"
          cat > "addons/web-app/app/src/main/res/drawable/icon.xml" <<'WEBAPP_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="oval">
              <solid android:color="#2F6F5E" />
              <size android:width="96dp" android:height="96dp" />
          </shape>
          WEBAPP_EOF
          mkdir -p "addons/web-app"
          cat > "addons/web-app/build.gradle" <<'WEBAPP_EOF'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
          }
          WEBAPP_EOF
          mkdir -p "addons/web-app"
          cat > "addons/web-app/gradle.properties" <<'WEBAPP_EOF'
          org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          WEBAPP_EOF
          mkdir -p "addons/web-app"
          cat > "addons/web-app/gradlew" <<'WEBAPP_EOF'
          #!/bin/sh
          # Reuse the repository's pinned Gradle distribution, but build this independent project.
          addon_dir=$(CDPATH= cd -- "$(dirname -- "$0")" && pwd) || exit 1
          exec sh "$addon_dir/../../launcher/gradlew" -p "$addon_dir" "$@"
          WEBAPP_EOF
          mkdir -p "addons/web-app"
          cat > "addons/web-app/settings.gradle" <<'WEBAPP_EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "webapp"
          include ':app'
          WEBAPP_EOF
          chmod +x addons/web-app/gradlew
      - name: Build
        working-directory: addons/web-app
        run: ./gradlew --no-daemon assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: web-app
          retention-days: 3
          path: addons/web-app/app/build/outputs/apk/release/app-release.apk
